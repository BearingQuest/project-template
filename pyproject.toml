[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "project-template"
version = "0.1.0"
description = "Template for BearingQuest projects"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "typer==0.27.3",
]

[project.scripts]
pt = "project_template.cli:app"

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.3",
  "ruff==0.17.3",
]

[tool.uv]
# A relative window: every `uv lock` considers only releases at least 7 days old.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov=project_template --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true
files = ["src/project_template"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
