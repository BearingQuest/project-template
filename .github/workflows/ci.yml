name: CI

# Checks on every pull request and every push to main:
#   - check:     `make check`: ruff, mypy, and pytest with the coverage floor.
#   - gitleaks:  secrets anywhere in the git history (SARIF to code scanning).
#   - semgrep:   static analysis with the public registry rules (SARIF to code scanning).
#   - pip-audit: known vulnerabilities in the versions locked in uv.lock.
#   - zizmor:    static analysis of the workflows in .github.
# All five must pass before merge; .github/rulesets/main.json requires them by name.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      # uv installs the Python named in .python-version.
      - name: Install dependencies from uv.lock
        run: uv sync --locked
      - name: Lint, format check and test
        run: make check

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository; a job block replaces the workflow grant
      security-events: write # upload the SARIF report to code scanning
    # gitleaks/gitleaks-action needs a licence key for organization repos, so
    # this runs the CLI directly. The version and checksum are bumped by hand;
    # Dependabot does not track them.
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum pinned)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # The release's checksums file must agree with the pinned checksum.
          published=$(awk -v f="$tarball" '$2 == f { print $1 }' checksums.txt)
          if [ "$published" != "$GITLEAKS_SHA256" ]; then
            echo "::error::checksums.txt has '$published' for $tarball, expected $GITLEAKS_SHA256"
            exit 1
          fi
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      # Findings do not stop this step: the report is uploaded first, then the
      # last step fails the job. gitleaks leaves lines marked gitleaks:allow
      # out of the SARIF, so no suppression filter is needed.
      - name: Scan git history
        id: scan
        continue-on-error: true
        run: ./gitleaks git --redact --verbose --report-format sarif --report-path gitleaks.sarif .
      # Skipped on fork pull requests, whose token cannot write security events.
      - name: Upload SARIF to code scanning
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      # Fails unless the scan succeeded and a readable SARIF report has no
      # results, so a gitleaks error or a missing report never passes.
      - name: Fail on findings
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          outcome = os.environ["SCAN_OUTCOME"]
          with open("gitleaks.sarif", encoding="utf-8") as handle:
              report = json.load(handle)
          if not report["runs"]:
              raise SystemExit("gitleaks.sarif has no runs")
          count = sum(len(run["results"]) for run in report["runs"])
          print(f"gitleaks scan {outcome}, {count} finding(s)")
          raise SystemExit(1 if count or outcome != "success" else 0)
          EOF

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Install pip-audit from uv.lock
        run: uv sync --locked
      # Exports every package in uv.lock with hashes, then audits that list
      # without pip. A new advisory against a locked version can fail a run
      # with no code change.
      - name: Audit locked dependencies
        run: |
          uv export --locked --format requirements-txt --no-emit-project --quiet --output-file requirements-audit.txt
          uv run --locked pip-audit --strict --disable-pip -r requirements-audit.txt

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository; a job block replaces the workflow grant
      security-events: write # upload the SARIF report to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      # The semgrep CLI from PyPI with public registry rules; no login and no
      # semgrep-action. --exclude-newer is the release date plus one day, so
      # uvx resolves semgrep's dependencies to a fixed snapshot. The rule packs
      # are fetched at run time and change over time (accepted, see
      # docs/decisions.md). Findings do not fail the scan; the last step does.
      - name: Scan
        run: |
          uvx --exclude-newer 2026-10-30 semgrep@1.183.0 scan \
            --config p/default --config p/python --config p/github-actions \
            --metrics off --sarif-output semgrep.sarif .
      # GitHub ignores SARIF suppressions, so results marked nosemgrep in the
      # source are dropped before the upload.
      - name: Drop results suppressed in source
        run: |
          python3 - <<'EOF'
          import json
          with open("semgrep.sarif", encoding="utf-8") as handle:
              report = json.load(handle)
          if not report["runs"]:
              raise SystemExit("semgrep.sarif has no runs")
          for run in report["runs"]:
              run["results"] = [r for r in run["results"] if not r.get("suppressions")]
          with open("semgrep.sarif", "w", encoding="utf-8") as handle:
              json.dump(report, handle)
          EOF
      # Skipped on fork pull requests, whose token cannot write security events.
      - name: Upload SARIF to code scanning
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on findings
        run: |
          python3 - <<'EOF'
          import json
          with open("semgrep.sarif", encoding="utf-8") as handle:
              report = json.load(handle)
          if not report["runs"]:
              raise SystemExit("semgrep.sarif has no runs")
          count = sum(len(run["results"]) for run in report["runs"])
          print(f"{count} unsuppressed semgrep finding(s)")
          raise SystemExit(1 if count else 0)
          EOF

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      # Fails on any finding. --exclude-newer is the release date plus one day.
      - name: Audit the workflows
        run: uvx --exclude-newer 2026-11-03 zizmor@1.32.0 .github
