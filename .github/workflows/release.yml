name: Release

# Pushing a v* tag (Dusten creates tags; agents never do) builds the package
# and opens a DRAFT GitHub release with the wheel, the sdist and the SBOM
# attached, each with a build-provenance attestation. Publishing the draft
# stays with Dusten. Not a required check.
#
# Two jobs, so code fetched during the build never runs where a write or OIDC
# token exists:
#   - build:   read-only token. Builds, writes the SBOM and the release notes,
#              and uploads them as an artifact.
#   - release: write and OIDC tokens. No checkout, no uv, no make: it only
#              downloads that artifact, attests it and creates the draft.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.1"
      # The tag must be v<version> from pyproject.toml, so the wheel and the
      # release agree.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match pyproject.toml version {version}")
          EOF
      - name: Build the wheel and the sdist
        run: uv build
      - name: Write the SBOM of the locked runtime dependencies
        run: make sbom
      # Fails when CHANGELOG.md has no section for this version; there is no
      # fallback to Unreleased.
      - name: Write the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py "${TAG#v}" CHANGELOG.md dist/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    name: release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
      attestations: write # store the build-provenance attestations
      id-token: write # OIDC token for the Sigstore signing certificate
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # actions/attest-build-provenance v4 wraps actions/attest, whose README
      # ("Usage") sets id-token: write and attestations: write. Its
      # artifact-metadata: write is for the storage record, which needs
      # push-to-registry: true on a container image; not used here.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-files/*.whl
            release-files/*.tar.gz
            release-files/sbom.cdx.json
      # Draft only: nothing is published until Dusten publishes it. There is
      # no checkout here, so GH_REPO tells gh which repository this is.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft --verify-tag --title "$TAG" \
            --notes-file release-files/release-notes.md \
            release-files/*.whl release-files/*.tar.gz release-files/sbom.cdx.json
